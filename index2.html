<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guitar Strings Navigation</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400&family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #F0F0F0;
      --coffee-dark: #272727;
      --ink-soft: #272727;
      --string: #272727;
      --font-en-small: "Times New Roman", Times, serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background-color: var(--paper);
      font-family: "Noto Sans TC", sans-serif;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.38;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.55'/%3E%3C/svg%3E");
      background-size: 180px 180px;
      mix-blend-mode: multiply;
    }

    .guitar-stage {
      position: relative;
      width: min(1320px, 96vw);
      height: min(520px, 70vh);
    }

    .bridge {
      position: absolute;
      left: 8.8%;
      top: 20%;
      width: 1.4%;
      height: 62%;
      background: var(--coffee-dark);
      border-radius: 2px;
      z-index: 2;
    }

    .string {
      position: absolute;
      left: 12%;
      width: 76%;
      min-height: 36px;
      border: 0;
      background: transparent;
      padding: 0;
      cursor: pointer;
      transform-origin: left center;
      z-index: 3;
      display: flex;
      align-items: center;
    }

    .string-line {
      flex: 1 1 0;
      height: 1.5px;
      background: var(--string);
      min-width: 8%;
    }

    .string-line--left { margin-right: 0.35rem; }
    .string-line--right { margin-left: 0.35rem; }

    .string-label {
      flex: 0 0 auto;
      max-width: 72%;
      padding: 0.18em 0.75em;
      background: var(--paper);
      color: var(--ink-soft);
      font-family: "Noto Serif TC", var(--font-en-small), serif;
      font-size: clamp(0.8rem, 1.35vw, 1rem);
      font-weight: 400;
      letter-spacing: 0.04em;
      white-space: nowrap;
      pointer-events: none;
      z-index: 2;
    }

    .string:nth-of-type(1) { top: calc(22% - 18px); }
    .string:nth-of-type(2) { top: calc(33% - 18px); }
    .string:nth-of-type(3) { top: calc(44% - 18px); }
    .string:nth-of-type(4) { top: calc(55% - 18px); }
    .string:nth-of-type(5) { top: calc(66% - 18px); }
    .string:nth-of-type(6) { top: calc(77% - 18px); }

    .string.is-plucked { animation: pluck 0.5s ease-out; }

    @keyframes pluck {
      0% { transform: translateY(0) scaleX(1); }
      20% { transform: translateY(-4px) scaleX(1.001); }
      35% { transform: translateY(3px) scaleX(0.999); }
      50% { transform: translateY(-2px) scaleX(1.001); }
      70% { transform: translateY(1px) scaleX(1); }
      100% { transform: translateY(0) scaleX(1); }
    }

    .note {
      position: absolute;
      font-size: clamp(1.1rem, 2.2vw, 1.6rem);
      color: var(--coffee-dark);
      pointer-events: none;
      z-index: 5;
      animation: rise 1s ease-out forwards;
    }

    @keyframes rise {
      0% { transform: translate(-50%, 0) scale(0.8); opacity: 0.95; }
      100% { transform: translate(-50%, -56px) scale(1.15) rotate(-8deg); opacity: 0; }
    }
  </style>
</head>
<body>
  <main class="guitar-stage" id="guitarStage">
    <div class="bridge" aria-hidden="true"></div>

    <button class="string" data-string="1" aria-label="關於裘賓 Antônio Carlos Jobim">
      <span class="string-line string-line--left" aria-hidden="true"></span>
      <span class="string-label">關於裘賓 Antônio Carlos Jobim</span>
      <span class="string-line string-line--right" aria-hidden="true"></span>
    </button>
    <button class="string" data-string="2" aria-label="什麼是波薩諾瓦？ What is Bossa Nova?">
      <span class="string-line string-line--left" aria-hidden="true"></span>
      <span class="string-label">什麼是波薩諾瓦？ What is Bossa Nova?</span>
      <span class="string-line string-line--right" aria-hidden="true"></span>
    </button>
    <button class="string" data-string="3" aria-label="1950年代現代化的巴西 The Modern Miracle">
      <span class="string-line string-line--left" aria-hidden="true"></span>
      <span class="string-label">1950年代現代化的巴西 The Modern Miracle</span>
      <span class="string-line string-line--right" aria-hidden="true"></span>
    </button>
    <button class="string" data-string="4" aria-label="國際的成功 The Global Stage">
      <span class="string-line string-line--left" aria-hidden="true"></span>
      <span class="string-label">國際的成功 The Global Stage</span>
      <span class="string-line string-line--right" aria-hidden="true"></span>
    </button>
    <button class="string" data-string="5" aria-label="1960年代巴西本土的裂痕 The Backlash">
      <span class="string-line string-line--left" aria-hidden="true"></span>
      <span class="string-label">1960年代巴西本土的裂痕  The Backlash</span>
      <span class="string-line string-line--right" aria-hidden="true"></span>
    </button>
    <button class="string" data-string="6" aria-label="1970 鉛色年代的沈默 The Tension">
      <span class="string-line string-line--left" aria-hidden="true"></span>
      <span class="string-label">1970 鉛色年代的沈默 The Tension</span>
      <span class="string-line string-line--right" aria-hidden="true"></span>
    </button>
  </main>

  <script>
    const stringAudio = {
      1: "./六根弦音檔/1(E).mp3",
      2: "./六根弦音檔/2(A).mp3",
      3: "./六根弦音檔/3(D).mp3",
      4: "./六根弦音檔/4(G).mp3",
      5: "./六根弦音檔/5(B).mp3",
      6: "./六根弦音檔/6(E).mp3"
    };

    const stage = document.getElementById("guitarStage");
    const strings = document.querySelectorAll(".string");
    const notePool = {};

    Object.entries(stringAudio).forEach(([key, src]) => {
      const audio = new Audio(src);
      audio.preload = "auto";
      notePool[key] = audio;
    });

    function spawnNote(x, y) {
      const note = document.createElement("span");
      note.className = "note";
      note.textContent = "♪";
      note.style.left = `${x}px`;
      note.style.top = `${y}px`;
      stage.appendChild(note);
      setTimeout(() => note.remove(), 1000);
    }

    strings.forEach((stringEl) => {
      stringEl.addEventListener("click", (event) => {
        const id = stringEl.dataset.string;
        const audio = notePool[id];
        if (audio) {
          audio.currentTime = 0;
          audio.play().catch(() => {});
        }

        stringEl.classList.remove("is-plucked");
        void stringEl.offsetWidth;
        stringEl.classList.add("is-plucked");

        const rect = stage.getBoundingClientRect();
        spawnNote(event.clientX - rect.left, event.clientY - rect.top - 8);
      });
    });
  </script>
</body>
</html>
