<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Rolling vinyl record icon">
  <defs>
    <radialGradient id="vinylBody" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4a4a4a" />
      <stop offset="45%" stop-color="#202020" />
      <stop offset="100%" stop-color="#080808" />
    </radialGradient>
    <radialGradient id="centerLabel" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#ffe2a8" />
      <stop offset="100%" stop-color="#c24b3f" />
    </radialGradient>
  </defs>

  <g transform="translate(128 128)">
    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0"
      to="360"
      dur="2.4s"
      repeatCount="indefinite"
    />

    <circle r="120" fill="url(#vinylBody)" />

    <circle r="98" fill="none" stroke="#3a3a3a" stroke-width="1.5" opacity="0.7" />
    <circle r="84" fill="none" stroke="#353535" stroke-width="1.4" opacity="0.65" />
    <circle r="70" fill="none" stroke="#303030" stroke-width="1.3" opacity="0.6" />
    <circle r="56" fill="none" stroke="#2b2b2b" stroke-width="1.2" opacity="0.55" />
    <circle r="42" fill="none" stroke="#262626" stroke-width="1.1" opacity="0.5" />

    <circle r="28" fill="url(#centerLabel)" />
    <circle r="5" fill="#f3f3f3" />
    <circle r="2.2" fill="#bfbfbf" />

    <ellipse cx="-38" cy="-54" rx="11" ry="6" fill="#ffffff" opacity="0.16" />
  </g>
</svg>
